<div id="chatContainer" class="container">
    <div class="chatform">
      <form>
        <div class="form-group">
          <label for="message">Message</label>
          <input type="text" class="form-control" id="message" placeholder="Your message" [(ngModel)]="text">
        </div>
        <div class="form-group">
          <label for="language-select">Target Language:</label>
          <select id="language-select" class="form-control" [(ngModel)]="targ">
            <option value="en">English</option>
            <option value="de">German</option>
            <option value="nl">Dutch</option>
            <option value="fr">French</option>
            <option value="ja">Japanese</option>
          </select>
        </div>
        <button (click)="sendMessage()" type="submit" class="btn btn-primary">Translate</button>
      </form>
    </div>
    <div class="section">
      <table class="table table-striped table-bordered">
        <thead>
          <tr>
            <th>Text</th>
            <th>Target Language</th>
            <th>Translation</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let item of messages.slice()">
            <td>{{ item.text }}</td>
            <td>{{ item.targ }}</td>
            <td>{{ item.transl }}</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
