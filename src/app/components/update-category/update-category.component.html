<!doctype html>
<html lang="en" data-bs-theme="auto">

    <head>
        <title>Category List</title>
    </head> 

    <body>
        <div class="container m-5" style="background-color:rgb(167, 203, 240);">
            <h3 class="my-1"  style="text-align: center;  padding-top:20px">Update Category</h3>	
            <div class="container mt-5" style="padding-left:450px; padding-bottom: 20px;">	
                <div class="row row-cols-1 row-cols-sm-2 g-3">
                    <div class="col" >
                        <div class="row justify-content-center">
                            <div class="col-md-12"> 
                                <div class="card shadow-sm" >
                                    <div class="card-body" >
                                        <p> Select one of the categories to update</p>
                                        <div class="mb-3">
                                            <label for="nameInput" class="form-label">Category Id</label>
                                            <input type="text" [(ngModel)]="category.id" class="form-control" id="id" placeholder="Enter category id">
                                        </div>
                                        <div class="mb-3">
                                            <label for="nameInput" class="form-label">Category Name</label>
                                            <input type="text" [(ngModel)]="category.name" class="form-control" id="name" placeholder="Enter category name">
                                        </div>

                                        <div class="mb-3">
                                            <label for="descriptionInput" class="form-label">Description</label>
                                            <input type="text" [(ngModel)]="category.description" class="form-control" id="description" placeholder="Enter description"/>
                                        </div>
                                        <div class="mb-3">
                                            <label for="imageInput" class="form-label">Image</label>
                                            <input type="text" [(ngModel)]="category.image" class="form-control" id="image" placeholder="Enter static resource path"/>
                                        </div>
                                        <div>
                                            <button class="btn btn-primary" (click)="updateCategory()">Update</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>	
        <div class="album py-1">
            <div class="container">
                <h3 class="my-2" style="text-align:center">Category List</h3>
                <div class="col">
                    <table class="table table-hover">
                        <tr style="text-align:center">
                            <th scope="col">Id</th>
                            <th scope="col">Category Name</th>
                            <th scope="col">Description</th>
                            <th scope="col">Image</th>
                            <th scope="col">Created Date</th>
                            <th scope="col">Actions</th>
                        </tr>
                    
                        <tbody>

                        <tr *ngIf="categories.length == 0">
                            <th scope="row" colspan="8" class="text-center text-bold">No records found</th>
                        </tr>

                        <tr *ngFor="let category of categories">
                            <th scope="row">
                                {{category.id}}
                            </th>
                            <td>
                                {{category.name}}
                            </td>
                            <td>
                                {{category.description}}
                            </td>
                            <td>
                                {{category.image}}
                                <br>
                                <img src = "../assets/images/{{category.image}}" style="width: 200px; height: 150px;">
                            </td>
                            <td>
                                {{category.createdAt }}
                            </td>
                            <!-- <a type="button" class="btn btn-primary" (click)="selectCategory(category.id, category.name, category.description)">Select</a> -->
                        </tr>

                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </body>
</html>
